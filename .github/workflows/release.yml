name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            command: npm run dist:mac -- --arm64 --x64
          - label: Windows
            os: windows-latest
            command: npm run dist:win -- --x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: contami-${{ matrix.label }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
          if-no-files-found: error

  publish:
    name: Publish private GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: contami-*
          path: artifacts
      - name: Prepare flat release assets and SHA-256 checksums
        shell: bash
        run: |
          mkdir release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -exec cp '{}' release-assets/ \;
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body: |
            ContaMì desktop preview for macOS and Windows.

            Questi artifact sono generati da GitHub Actions senza certificati e senza firma ad-hoc del bundle. Verificare `SHA256SUMS.txt` prima dell’installazione.

            - macOS: aprire il DMG e trascinare `Contami` in Applicazioni. Se lo sviluppatore non può essere verificato, usare Impostazioni di Sistema → Privacy e sicurezza → Apri comunque. Non disabilitare Gatekeeper globalmente.
            - Windows: se SmartScreen mostra “PC protetto da Windows”, usare Ulteriori informazioni → Esegui comunque solo dopo aver verificato il checksum. Non disattivare Smart App Control se impedisce l’avvio.

            These artifacts are produced by GitHub Actions without certificates and without a bundle-level ad-hoc signature. Verify `SHA256SUMS.txt` before installation.

            - macOS: open the DMG and drag `Contami` to Applications. If the developer cannot be verified, use System Settings → Privacy & Security → Open Anyway. Do not disable Gatekeeper globally.
            - Windows: if SmartScreen displays “Windows protected your PC”, use More info → Run anyway only after verifying the checksum. Do not turn off Smart App Control if it blocks the app.
          files: release-assets/*
